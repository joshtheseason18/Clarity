<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luclaro</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="design.css?v=35">

  <!-- Supabase (loaded before app scripts) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="app">
  <!-- Nav Rail -->
  <nav class="rail" id="rail"></nav>

  <!-- Main area -->
  <div id="main">
    <header class="header" id="header"></header>
    <div id="content">
      <div class="screen" id="screen-today"></div>
      <div class="screen" id="screen-calendar"><div class="screen-placeholder">Calendar</div></div>
      <div class="screen" id="screen-braindump"></div>
      <div class="screen" id="screen-notes"></div>
      <div class="screen" id="screen-focus"></div>
      <div class="screen" id="screen-settings"></div>
      <div class="screen" id="screen-routineshub"></div>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="authoverlay"></div>
  <div id="searchoverlay"></div>
</div>

<!-- App scripts -->
<script src="store.js?v=22"></script>
<script src="routines.js?v=21"></script>
<script src="today.js?v=30"></script>
<script src="braindump.js?v=31"></script>
<script src="notes.js?v=27"></script>
<script src="focus.js?v=5"></script>
<script src="settings.js?v=13"></script>
<script src="calendar.js?v=28"></script>
<script src="sync.js?v=2"></script>
<script src="auth.js?v=3"></script>
<script src="search.js?v=4"></script>
<script src="main.js?v=20"></script>

</body>
</html>
